<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Aula Flexbox</title>
</head>
<body>
    <div class="space-between">
        <img src="/img/icone-bicicleta.png" alt="">
        <img src="/img/icone-fantasma.png" alt="">
        <img src="/img/icone-hipopotamo.png" alt="">
    </div>

    <div class="space-around">
        <img src="/img/icone-bicicleta.png" alt="">
        <img src="/img/icone-fantasma.png" alt="">
        <img src="/img/icone-hipopotamo.png" alt="">
    </div>

    <div class="flex-end">
        <img src="/img/icone-bicicleta.png" alt="">
        <img src="/img/icone-fantasma.png" alt="">
        <img src="/img/icone-hipopotamo.png" alt="">
    </div>

    <div class="space-between">
        <img src="/img/icone-bicicleta.png" alt="">
        <span>
            <img src="/img/icone-bicicleta.png" alt="">
            <img src="/img/icone-fantasma.png" alt="">
            <img src="/img/icone-hipopotamo.png" alt="">
        </span>
    </div>

    <div class="space-between">
        <img src="/img/icone-bicicleta.png" alt="">
        <span class="space-between-span">
            <img src="/img/icone-bicicleta.png" alt="">
            <img src="/img/icone-fantasma.png" alt="">
            <img src="/img/icone-hipopotamo.png" alt="">
        </span>
    </div>

    <div class="space-between">
        <img src="/img/icone-bicicleta.png" alt="">
        <img src="/img/icone-fantasma.png" alt="">
        <span>
            <img src="/img/icone-bicicleta.png" alt="">
            <img src="/img/icone-fantasma.png" alt="">
            <img src="/img/icone-hipopotamo.png" alt="">
        </span>
    </div>

    <div class="space-around">
        <img src="/img/icone-bicicleta.png" alt="">
        <span>
            <img src="/img/icone-fantasma.png" alt="">
            <img src="/img/icone-hipopotamo.png" alt="">
        </span>
        <span>
            <img src="/img/icone-bicicleta.png" alt="">
            <img src="/img/icone-fantasma.png" alt="">
            <img src="/img/icone-hipopotamo.png" alt="">
        </span>
    </div>

    <div class="column">
       <img src="/img/icone-bicicleta.png" alt="">
        <span>
            <img src="/img/icone-fantasma.png" alt="">
            <img src="/img/icone-hipopotamo.png" alt="">
        </span>
        <span>
            <img src="/img/icone-bicicleta.png" alt="">
            <img src="/img/icone-fantasma.png" alt="">
            <img src="/img/icone-hipopotamo.png" alt="">
        </span> 
    </div>

    <div class="column">
        <div class="group-pink">
            <img src="/img/icone-bicicleta.png" alt="">
            <span>
                <img src="/img/icone-bicicleta.png" alt="">
                <img src="/img/icone-fantasma.png" alt="">
                <img src="/img/icone-hipopotamo.png" alt="">
            </span>
        </div>

        <div class="group-pink">
            <span>
                <img src="/img/icone-fantasma.png" alt="">
                <img src="/img/icone-hipopotamo.png" alt=""> 
            </span>

            <span>
                <img src="/img/icone-fantasma.png" alt="">
                <img src="/img/icone-hipopotamo.png" alt=""> 
            </span>

            <span>
                <img src="/img/icone-fantasma.png" alt="">
                <img src="/img/icone-hipopotamo.png" alt=""> 
            </span>
        </div>
    </div>
</body>
</html>
